# nginx: proxy reverso para blueprints en el droplet.
#
#   sudo cp deploy/nginx/blueprints.moibe.me.conf /etc/nginx/sites-available/blueprints.moibe.me
#   sudo ln -s /etc/nginx/sites-available/blueprints.moibe.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blueprints.moibe.me --redirect
#
# Este archivo trae solo el bloque de :80. certbot --nginx lo duplica en :443 con el
# certificado y deja el de :80 como redirección a https. No hace falta tocarlo a mano.
# La app escucha SOLO en 127.0.0.1:1000 (HOST/PORT en .env), así que nada llega a Node
# sin pasar por aquí.

server {
    listen 80;
    listen [::]:80;
    server_name blueprints.moibe.me;

    # Cabeceras de seguridad básicas (la app es privada, no se incrusta en ningún lado).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # >= BODY_SIZE_LIMIT de adapter-node (512K por defecto); aquí no se suben archivos.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:1000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ADDRESS_HEADER=x-forwarded-for + XFF_DEPTH=1 en .env: la app toma la última IP
        # de la lista, que es la que vio nginx, aunque el cliente mande su propio header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
